<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darbai">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7a00'/%3E%3Cpath d='M12 26h22v18H12zM34 32h9l7 8v4H34z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='46' r='4' fill='white'/%3E%3Ccircle cx='43' cy='46' r='4' fill='white'/%3E%3C/svg%3E">
<title>SAREK darbai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f4f6f8; --paper:#ffffff; --ink:#1e2329; --mute:#5d6873; --line:#dfe3e8;
  --pick:#ff7a00; --pick-ink:#a84f00; --ret:#2f6db5; --ret-ink:#24589a;
  --field:#fbfcfd; --hover:rgba(30,35,41,.06); --focus:#1f6feb; --danger:#c0392b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#101316; --paper:#171a1e; --ink:#e6e9ed; --mute:#9aa4ae; --line:#2b3137;
    --pick:#ff8a1f; --pick-ink:#ffaa5c; --ret:#6aa3e8; --ret-ink:#93bdf0;
    --field:#1d2126; --hover:rgba(230,233,237,.08); --focus:#7fb0ff; --danger:#ff7b6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#101316; --paper:#171a1e; --ink:#e6e9ed; --mute:#9aa4ae; --line:#2b3137;
  --pick:#ff8a1f; --pick-ink:#ffaa5c; --ret:#6aa3e8; --ret-ink:#93bdf0;
  --field:#1d2126; --hover:rgba(230,233,237,.08); --focus:#7fb0ff; --danger:#ff7b6b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:Archivo,"Arial Narrow",Arial,system-ui,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 96px}

/* every text is a field: looks like text, edits in place */
.f{display:block;width:100%;margin:0;padding:0;border:0;border-radius:4px;background:transparent;
   color:inherit;font:inherit;line-height:inherit;letter-spacing:inherit;resize:none;overflow:hidden;
   white-space:pre-wrap;overflow-wrap:break-word;-webkit-appearance:none;appearance:none}
textarea.f:focus{outline:2px solid var(--route,var(--focus));outline-offset:3px;background:var(--field)}
@media (hover:hover){textarea.f:hover{background:var(--hover)}}
textarea.f::placeholder{color:var(--mute);opacity:.7}
textarea.f:not(:focus)::placeholder{color:transparent}
div.f a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
div.f a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.mark{flex:none;width:44px;height:44px;border-radius:12px;background:var(--pick);color:#fff;display:grid;place-items:center}
.mark svg{width:28px;height:28px}
.hdr{flex:1;min-width:0;--route:var(--pick)}
.title{font-size:30px;line-height:1.08;font-weight:800;font-stretch:88%;letter-spacing:-.01em}
.lede{margin-top:4px;color:var(--mute);max-width:62ch}
.pdfbtn{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pdfbtn svg{width:18px;height:18px;color:var(--pick)}
.pdfbtn:hover{border-color:var(--pick)}
.pdfbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pdfbtn[disabled]{opacity:.6;cursor:progress}
.pdfbtn[hidden]{display:none}
.status{min-height:1.4em;margin:10px 0 0 58px;font-size:13px;color:var(--mute)}
.status[data-state="ok"]{color:var(--ret-ink)}
.status[data-state="err"]{color:var(--danger)}

/* day blocks */
.day{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.pick{--route:var(--pick);--route-ink:var(--pick-ink)}
.day.ret{--route:var(--ret);--route-ink:var(--ret-ink)}
.dayhd{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:3px solid var(--route)}
.dayhd > svg{flex:none;width:26px;height:26px;color:var(--route)}
.day.ret .dayhd > svg{transform:scaleX(-1)}
.dayhd > div{flex:1;min-width:0}
.dtitle{font-size:21px;line-height:1.15;font-weight:800;font-stretch:88%;color:var(--route-ink)}
.dsub{margin-top:2px;font-size:14px;color:var(--mute)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* table */
table.run{width:100%;border-collapse:collapse;table-layout:fixed}
.run th{text-align:left;vertical-align:top;font-weight:600;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.th{font-size:13px;font-weight:600;color:var(--mute)}
.run td{vertical-align:top;padding:12px 12px 14px;border-bottom:1px solid var(--line)}
.run tbody tr:last-child td{border-bottom:0}
.run col.k-time{width:126px}
.run col.k-stop{width:21%}
.run col.k-photos{width:30%}
.run col.k-act{width:44px}
.run col.k-text{width:15%}
.run th.first{padding-left:34px}
.thw{position:relative}
.editable .thw{padding-right:28px}
.thw .kbtn{position:absolute;right:-6px;top:-5px}

/* the route: a line down the first column, a stop marker per row */
.run td.first{position:relative;padding-left:34px}
.run td.first::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:3px;background:var(--route)}
.run tbody tr:first-child td.first::before{top:20px}
.run tbody tr:last-child td.first::before{bottom:auto;height:20px}
.run tbody tr:only-child td.first::before{display:none}
.run td.first::after{content:"";position:absolute;left:8px;top:14px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--route)}
.run tr.emptyrow td::before,.run tr.emptyrow td::after{display:none}
.t{font-size:19px;line-height:1.15;font-weight:800;font-stretch:80%;color:var(--route-ink)}
.t.word{font-size:16px;font-stretch:68%}

.nm{font-size:16px;font-weight:700;line-height:1.25}
.dt{font-size:14px;margin-top:2px}
.ck{margin-top:6px;color:var(--mute);font-size:14px}

.ph{min-height:44px;font-size:16px;line-height:1.4;background:var(--field);border:1.5px dashed var(--route);border-radius:9px;padding:8px 10px}
textarea.ph:focus{border-style:solid;outline-offset:1px}
.ph.ro{border-style:solid;border-color:var(--line)}
.lbl{display:none}

/* row and column menus */
.run td.act{padding:8px 4px;text-align:center}
.kbtn{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--mute);cursor:pointer}
.kbtn svg{width:18px;height:18px}
.kbtn:hover,.kbtn[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
.kbtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.actw{display:flex;flex-direction:column;align-items:center;gap:2px}
.grip{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--mute);
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip svg{width:16px;height:16px}
.grip:hover{background:var(--hover);color:var(--ink)}
.grip:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.run tr.dragging td{opacity:.3}
.run tr.moved td{animation:moved .9s ease-out}
@keyframes moved{from{background:var(--hover)}to{background:transparent}}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;max-width:80vw;padding:10px 14px;border-radius:12px;background:var(--paper);color:var(--ink);
  border:2px solid var(--pick);box-shadow:0 14px 34px rgba(0,0,0,.28);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost.ret{border-color:var(--ret)}
.dropline{position:fixed;z-index:39;height:4px;margin-top:-2px;border-radius:2px;pointer-events:none;background:var(--pick)}
.dropline.ret{background:var(--ret)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.pics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pics[hidden]{display:none}
.pic{position:relative;flex:none;width:112px;height:112px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--hover);cursor:pointer}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pic.add{display:grid;place-items:center;border:1.5px dashed var(--route);background:transparent;color:var(--route-ink)}
.pic.add svg{width:34px;height:34px}
.pic.busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--route);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,14,.94);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:8px}
.lbbar{display:flex;gap:10px;margin-top:14px}
.lbbar button{padding:11px 18px;border-radius:10px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.lbbar button.danger{border-color:#ff8a7d;color:#ffa79d}
.lbbar button[hidden]{display:none}
.addrow{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px dashed var(--route);border-radius:9px;background:transparent;color:var(--route-ink);font:inherit;font-weight:600;cursor:pointer}
.emptyrow td{padding:16px 18px;color:var(--mute)}
.menu{position:fixed;z-index:20;min-width:190px;padding:6px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:15px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button.danger{color:var(--danger)}
.menu button[disabled]{opacity:.45;cursor:default;background:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;
  max-width:calc(100% - 24px);padding:8px 8px 8px 16px;background:var(--ink);color:var(--paper);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.25);font-size:15px}
.toast[hidden]{display:none}
.toast button{border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 10px;cursor:pointer}

@media (pointer: coarse){
  .kbtn,.grip{width:36px;height:36px}
  .pic{width:128px;height:128px}
  .editable .thw{padding-right:34px}
  .run col.k-time{width:134px}
  .run col.k-act{width:48px}
}
@media (max-width: 760px){
  .wrap{padding:18px 14px 96px}
  .run col.k-time{width:118px}
  .run col.k-stop{width:21%}
  .run col.k-photos{width:26%}
  .run th{padding:9px 8px 7px}
  .run td{padding:11px 8px 13px}
  .run th.first,.run td.first{padding-left:30px}
  .run td.first::before{left:12px}
  .run td.first::after{left:6px}
  .t{font-size:17px}
  .t.word{font-size:14px;font-stretch:68%}
  .nm{font-size:15px}
  .dt,.ck{font-size:13.5px}
  .ph{padding:7px 8px}
}
@media (max-width: 760px) and (pointer: coarse){
  .run col.k-time{width:126px}
}
/* narrow: every row becomes a stop on the route */
@media (max-width: 540px){
  .wrap{padding:16px 12px 96px}
  .top{flex-wrap:wrap}
  .hdr{flex:1 1 calc(100% - 58px)}
  .pdfbtn{margin-left:58px}
  .title{font-size:26px}
  .status{margin-left:0}
  .dayhd{padding:12px 14px}
  .run{min-width:0!important}
  .run, .run tbody, .run thead, .run thead tr{display:block}
  .run thead{display:none}
  .editable .day:first-child .run thead{display:block;padding:10px 14px 10px;border-bottom:1px solid var(--line)}
  .editable .day:first-child .run thead::before{content:"Stulpeliai";display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:2px}
  .run thead th{display:block;padding:4px 0;border:0}
  .run th.first{padding-left:0}
  .run th.act{display:none}
  .run tbody tr{display:block;position:relative;padding:14px 14px 16px 44px;border-bottom:1px solid var(--line)}
  .editable .run tbody tr{padding-right:46px}
  .run tbody tr:last-child{border-bottom:0}
  .run tbody tr::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:3px;background:var(--route)}
  .run tbody tr:first-child::before{top:22px}
  .run tbody tr:last-child::before{bottom:auto;height:22px}
  .run tbody tr:only-child::before,.run tr.emptyrow::before{display:none}
  .run td{display:block;padding:0;border:0}
  .run td.first{position:static;padding:0}
  .run td.first::before{display:none}
  .run td.first::after{left:12px;top:16px}
  .run td.act{position:absolute;top:8px;right:6px;padding:0}
  .thw .kbtn{right:0;top:-4px}
  .run tr.emptyrow{padding:14px}
  .t{font-size:19px}
  .t.word{font-size:16px;font-stretch:80%}
  .nm{font-size:16px}
  .run td.k-stop{margin-top:2px}
  .run td.k-job{margin-top:8px}
  .run td.k-photos,.run td.k-text{margin-top:10px}
  .run td.first.k-photos,.run td.first.k-text{margin-top:0}
  .lbl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
}
/* touch screens: fields at 16px or more, so iPhone doesn't zoom in while typing */
@media (pointer: coarse){
  .lede,.dsub,.th,.nm,.dt,.jb,.ck,.tx,.t.word{font-size:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.01s!important}}
.dayhd > .kbtn{flex:none;align-self:flex-start}
.dayfoot{padding:10px 18px 14px;border-top:1px solid var(--line)}
.adddaybtn{display:block;width:100%;margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--mute);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.adddaybtn:hover{border-color:var(--pick);color:var(--pick-ink)}
div.f.ro:empty{display:none}
@media (max-width: 540px){
  body:not(.editable) .run td.k-photos:not(:has(.pics:not([hidden]))):not(:has(div.f:not(:empty))),
  body:not(.editable) .run td.k-text:not(:has(div.f:not(:empty))){display:none}
}
.status[data-state="live"]{color:var(--mute)}
.status[data-state="live"]::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#2e9e5b;vertical-align:1px}
.mark{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none;cursor:default}
.mark .ring{position:absolute;inset:-4px;width:52px;height:52px;opacity:0;pointer-events:none;transform:rotate(-90deg)}
.mark .ring circle{fill:none;stroke:var(--pick);stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100}
.mark.holding .ring{opacity:1}
.mark.holding .ring circle{animation:ringfill 8s linear forwards}
@keyframes ringfill{to{stroke-dashoffset:0}}
.stopedit{display:inline-block;margin:4px 0 0 58px;padding:6px 0;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.stopedit[hidden]{display:none}
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,12,14,.55)}
.gate[hidden]{display:none}
.gatebox{width:100%;max-width:340px;padding:22px 20px 16px;border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 18px 44px rgba(0,0,0,.3);text-align:center}
.gtitle{margin:0 0 6px;font-size:17px;font-weight:700}
.gmsg{min-height:1.3em;margin:0 0 12px;font-size:14px;color:var(--danger)}
.gbtn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--pick);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.gbtn[disabled]{opacity:.6;cursor:progress}
.glink{margin-top:8px;padding:10px;border:0;background:none;color:var(--mute);font:inherit;font-size:15px;cursor:pointer}
@media (max-width: 540px){ .stopedit{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" id="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10h3M2 13h2M1.5 16h2.5"/><path d="M5 8.5h9.5V17H5z"/><path d="M14.5 11h3.3l2.7 3v3h-6z"/><circle cx="8" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/><circle cx="18.5" cy="5.5" r="3.8"/><path d="M18.5 3.7v1.9l1.3 1"/></svg><svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" pathLength="100"/></svg></div>
    <div class="hdr" id="hdr"></div>
  </header>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <button type="button" class="stopedit" id="stopEdit" hidden>Baigti redaguoti</button>
  <div id="days"></div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Nuotrauka"><img id="lbImg" alt=""><div class="lbbar"><button type="button" id="lbDel" class="danger">Ištrinti nuotrauką</button><button type="button" id="lbClose">Uždaryti</button></div></div>
<div class="gate" id="gate" hidden role="dialog" aria-modal="true" aria-label="Redagavimas">
  <div class="gatebox">
    <p class="gtitle">Redaguoti gali tik Karolis ir Indrė.</p>
    <p class="gmsg" id="gateMsg"></p>
    <button type="button" class="gbtn" id="gateGo">Prisijungti su Google</button>
    <button type="button" class="glink" id="gateClose">Uždaryti</button>
  </div>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg" role="status" aria-live="polite"></span><button type="button" id="undo">Atšaukti</button></div>
<script>
(function(){
  'use strict';
  var VAN = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10h3M2 13h2M1.5 16h2.5"/><path d="M5 8.5h9.5V17H5z"/><path d="M14.5 11h3.3l2.7 3v3h-6z"/><circle cx="8" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/><circle cx="18.5" cy="5.5" r="3.8"/><path d="M18.5 3.7v1.9l1.3 1"/></svg>';
  var DOTS = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';
  var GRIP = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"/><circle cx="15" cy="5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="19" r="1.8"/><circle cx="15" cy="19" r="1.8"/></svg>';
  var CAM = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.4"/><path d="M19 3v4M17 5h4"/></svg>';
  var WJ = '\u2060';

      for (var i = 0; i < rows.length; i++) { var rr = rows[i].getBoundingClientRect(); if (y > rr.top + rr.height / 2) idx = i + 1; }
      var ly = !rows.length ? br.top + 4 : (idx >= rows.length ? rows[rows.length - 1].getBoundingClientRect().bottom : rows[idx].getBoundingClientRect().top);
      best = { dist:dist, day:sec.dataset.day, idx:idx, ly:ly, left:br.left, width:br.width };
    });
    drag.target = best;
    if (!best) { drag.line.style.display = 'none'; return; }
    drag.line.style.display = 'block';
    drag.line.className = 'dropline' + (dayKind(best.day) === 'ret' ? ' ret' : '');
    drag.line.style.top = best.ly + 'px'; drag.line.style.left = (best.left + 8) + 'px'; drag.line.style.width = Math.max(0, best.width - 16) + 'px';
  }
  function autoScroll(){
    if (!drag) return;
    var H = window.innerHeight, edge = 80, v = 0;
    if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 5);
    else if (drag.y > H - edge) v = Math.ceil((drag.y - (H - edge)) / 5);
    if (v) { window.scrollBy(0, v); findTarget(); }
    drag.raf = requestAnimationFrame(autoScroll);
  }
  function stopDrag(){
    var d = drag; if (!d) return null;

    d.handle.removeEventListener('pointerup', endDrag);

  }
  function endDrag(ev){
    if (!drag || ev.pointerId !== drag.pid) return;

    var src = layout.rows[d.from], i = src.indexOf(d.id);

    src.splice(i, 1);
    layout.rows[t.day].splice(Math.min(t.idx, layout.rows[t.day].length), 0, d.id);
    saveLayout(); render();
    var row = document.querySelector('tr[data-row="' + d.id + '"]');
    if (row) { row.classList.add('moved'); setTimeout(function(){ row.classList.remove('moved'); }, 1000); }
  }
  function cancelDrag(){ stopDrag(); if (renderLater) render(); }

  /* ---------- photos: shrunk on the phone, kept in the page's database ---------- */
  function picsFor(rid){
    return Object.keys(pics).filter(function(k){ return pics[k].row === rid; })
      .map(function(k){ return { id:k, p:pics[k] }; }).sort(function(a, b){ return a.p.at - b.p.at; });
  }
  function picStrip(rid){
    var w = document.createElement('div'); w.className = 'pics';
    strips[rid] = w; fillStrip(rid);
    return w;
  }
  function fillStrip(rid){
    var w = strips[rid]; if (!w) return;
    w.innerHTML = '';
    var list = picsFor(rid);
    list.forEach(function(x, i){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pic'; b.setAttribute('aria-label', 'Nuotrauka ' + (i + 1) + ' iš ' + list.length);
      var im = document.createElement('img'); im.alt = ''; im.decoding = 'async'; im.src = x.p.th;
      b.appendChild(im);
      b.addEventListener('click', function(){ openPic(x.id); });
      w.appendChild(b);
    });
    Object.keys(uploading).forEach(function(k){
      if (uploading[k] !== rid) return;
      var s = document.createElement('div'); s.className = 'pic busy'; s.setAttribute('aria-label', 'Įkeliama nuotrauka'); w.appendChild(s);
    });
    if (editable && !locked) {
      var a = document.createElement('button');
      a.type = 'button'; a.className = 'pic add'; a.innerHTML = CAM; a.setAttribute('aria-label', 'Pridėti nuotraukų');
      a.addEventListener('click', function(){ pickPhotos(rid); });
      w.appendChild(a);
    }
    w.hidden = !w.children.length;
  }
  function pickPhotos(rid){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
    inp.addEventListener('change', function(){
      var files = [].slice.call(inp.files || []); inp.remove();
      files.forEach(function(f){ addPic(rid, f); });
    });
    document.body.appendChild(inp); inp.click();
  }
  function shrink(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var W0 = img.naturalWidth, H0 = img.naturalHeight;
        function draw(max){
          var k = Math.min(1, max / Math.max(W0, H0)), w = Math.max(1, Math.round(W0 * k)), h = Math.max(1, Math.round(H0 * k));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
          return c;
        }
        var th = draw(360).toDataURL('image/jpeg', 0.7), dims = [1600, 1400, 1200, 1000, 820], qs = [0.8, 0.7, 0.6, 0.5];
        for (var i = 0; i < dims.length; i++) {
          var c = draw(dims[i]);
          for (var j = 0; j < qs.length; j++) { var d = c.toDataURL('image/jpeg', qs[j]); if (d.length <= 700000) { res({ data:d, th:th, w:c.width, h:c.height }); return; } }
        }
        rej(new Error('big'));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
  function addPic(rid, file){
    if (!db || locked) return;
    var tmp = newId('u'); uploading[tmp] = rid; fillStrip(rid);
    say('Įkeliama nuotrauka\u2026');
    var id = null;
    shrink(file).then(function(r){
      id = newId('p');
      var doc = { row:rid, th:r.th, w:r.w, h:r.h, at:Date.now() };
      pics[id] = doc; delete uploading[tmp]; fillStrip(rid);
      return FS.addPic(id, doc, r.data);
    }).then(function(){ if (!Object.keys(uploading).length) say('Nuotrauka išsaugota ' + hhmm() + '.', 'ok'); }, function(e){
      delete uploading[tmp]; if (id) delete pics[id]; fillStrip(rid);
      var c = e && e.code;
      say(c === 'resource-exhausted' ? 'Nebėra vietos nuotraukoms. Ištrinkite senų.' :
          (e && e.message === 'decode') ? 'Nepavyko atidaryti nuotraukos. Bandykite JPG arba PNG.' : 'Nepavyko įkelti nuotraukos. Bandykite dar kartą.', 'err');
    });
  }
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbDel = document.getElementById('lbDel'), lbId = null, lbFrom = null;
  function openPic(id){
    if (!pics[id]) return;
    lbId = id; lbFrom = document.activeElement;
    lbImg.src = pics[id].th; lbDel.hidden = !(editable && !locked);
    lb.hidden = false; document.getElementById('lbClose').focus();
    FS.full(id).then(function(src){ if (src && lbId === id) lbImg.src = src; });
  }
  function closePic(){ if (lb.hidden) return; lb.hidden = true; lbImg.removeAttribute('src'); lbId = null; if (lbFrom && lbFrom.focus) lbFrom.focus({ preventScroll:true }); }
  document.getElementById('lbClose').addEventListener('click', closePic);
  lb.addEventListener('click', function(ev){ if (ev.target === lb) closePic(); });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && !lb.hidden) closePic(); });
  lbDel.addEventListener('click', function(){
    var id = lbId, p = pics[id]; if (!p || !db) return;
    closePic(); delete pics[id]; fillStrip(p.row);
    var keep = null;
    FS.full(id).then(function(f){ keep = f; return FS.delPic(id); }).then(function(){}, function(){ pics[id] = p; fillStrip(p.row); say('Nepavyko ištrinti nuotraukos.', 'err'); });
    toast('Nuotrauka ištrinta.', function(){ pics[id] = p; fillStrip(p.row); FS.addPic(id, p, keep || p.th).then(function(){ say('Nuotrauka grąžinta ' + hhmm() + '.', 'ok'); }, function(){ say('Nepavyko grąžinti nuotraukos.', 'err'); }); });
  });
  function onPic(id, d, removed){
    var old = pics[id] ? pics[id].row : null;
    if (removed) delete pics[id];
    else if (d && typeof d.row === 'string' && typeof d.th === 'string' && d.th.indexOf('data:image/') === 0) pics[id] = { row:d.row, th:d.th, w:d.w || 0, h:d.h || 0, at:d.at || 0 };
    else return;
    if (old && old !== (pics[id] && pics[id].row)) fillStrip(old);
    if (pics[id]) fillStrip(pics[id].row);
    if (removed && lbId === id) closePic();
  }

  /* ---------- undo toast ---------- */
  var toastEl = document.getElementById('toast'), toastTimer = 0, undoFn = null;
  function toast(msg, undo){
    document.getElementById('toastMsg').textContent = msg;
    undoFn = undo; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 8000);
  }
  function hideToast(){ toastEl.hidden = true; undoFn = null; }
  document.getElementById('undo').addEventListener('click', function(){ var f = undoFn; hideToast(); if (f) f(); });

  /* ---------- status ---------- */
  var statusEl = document.getElementById('status');
  function say(t, state){ statusEl.textContent = t; statusEl.dataset.state = state || ''; }
  function hhmm(){ var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  /* ---------- saving: one write at a time per document ---------- */
  var pend = {};
  function layoutData(){
    var rows = {};
    layout.days.forEach(function(d){ rows[d.id] = (layout.rows[d.id] || []).slice(); });
    return { cols: layout.cols.map(function(c){ return { id:c.id, type:c.type }; }), days: layout.days.map(function(d){ return { id:d.id, kind:d.kind }; }), rows: rows, at: Date.now() };
  }
  function dataFor(path){ return path === 'layout/sheet' ? layoutData() : { text: val(path), at: Date.now() }; }
  function busy(except){ for (var k in pend) if (k !== except && (pend[k].dirty || pend[k].inflight)) return true; return false; }
  function schedule(path, ms){
    var p = pend[path] || (pend[path] = { timer:0, inflight:false, dirty:false, tries:0 });
    p.dirty = true; clearTimeout(p.timer);
    p.timer = setTimeout(function(){ flush(path); }, ms == null ? 700 : ms);
  }
  function flush(path){
    var p = pend[path];
    if (!p || !p.dirty || locked || !db || p.inflight) return;
    clearTimeout(p.timer); p.dirty = false; p.inflight = true;
    say('Saugoma\u2026');
    FS.save(path).then(function(){
      p.tries = 0;
      if (!p.dirty && !busy(path)) say('Išsaugota ' + hhmm() + '.', 'ok');
    }, function(e){
      var c = e && e.code;
      if (c === 'permission-denied' || c === 'unauthenticated') {
        lock('Šiame įrenginyje redaguoti negalima.');
      } else if (p.tries < 1) {
        p.tries++; p.dirty = true; say('Nepavyko išsaugoti. Bandau dar kartą\u2026', 'err');
        clearTimeout(p.timer); p.timer = setTimeout(function(){ flush(path); }, 1500 + Math.random() * 1500);
      } else {
        p.tries = 0; p.dirty = true; say('Nepavyko išsaugoti. Pakeiskite ką nors, ir bus bandoma vėl.', 'err');
      }
    }).then(function(){
      p.inflight = false;
      if (p.dirty && !locked && p.tries === 0) schedule(path, 400);
    });
  }
  function saveLayout(){ schedule('layout/sheet', 0); }
  function onInput(ev){
    var t = ev.target, key = t.dataset.key;
    if (locked) return;
    text[key] = t.value; fit(t); timeCls(t, t.value);
    (els[key] || []).forEach(function(o){ if (o !== t) setEl(o, t.value); });
    if (key.indexOf('texts/col.') === 0) syncLabels(key.slice(10));
    say('Saugoma\u2026'); schedule(key);
  }
  function onBlur(ev){ var key = ev.target.dataset.key, p = pend[key]; if (p && p.dirty && !locked) flush(key); }

  /* ---------- incoming changes ---------- */
  function apply(key, v){
    var p = pend[key];
    if (p && (p.dirty || p.inflight)) return;
    var list = els[key] || [];
    for (var i = 0; i < list.length; i++) if (list[i] === document.activeElement) return;
    if (v === null) { if (!has(text, key)) return; delete text[key]; }
    else { if (has(text, key) && text[key] === v) return; text[key] = v; }
    var now = val(key);
    list.forEach(function(e){ setEl(e, now); });
    if (key.indexOf('texts/col.') === 0) syncLabels(key.slice(10));
  }
  var ID = /^[A-Za-z0-9-]{1,40}$/;
  function sanitize(d){
    if (!d || !Array.isArray(d.cols) || !d.rows || typeof d.rows !== 'object') return null;
    var seen = {}, cols = [];
    d.cols.forEach(function(c){
      if (c && typeof c.id === 'string' && ID.test(c.id) && !seen[c.id] && TYPES.indexOf(c.type) >= 0) { seen[c.id] = 1; cols.push({ id:c.id, type:c.type }); }
    });
    if (!cols.length) return null;
    var days = [], ds = {};
    (Array.isArray(d.days) ? d.days : []).forEach(function(x){
      if (x && typeof x.id === 'string' && ID.test(x.id) && !ds[x.id]) { ds[x.id] = 1; days.push({ id:x.id, kind: x.kind === 'ret' ? 'ret' : 'pick' }); }
    });
    if (!days.length) return null;
    var rows = {}, s = {};
    days.forEach(function(day){
      var src = Array.isArray(d.rows[day.id]) ? d.rows[day.id] : [];
      rows[day.id] = src.filter(function(id){ if (typeof id === 'string' && ID.test(id) && !s[id]) { s[id] = 1; return true; } return false; });
    });
    return { cols:cols, days:days, rows:rows };
  }
  function onLayout(d){
    var p = pend['layout/sheet'];
    if (p && (p.dirty || p.inflight)) return;
    var L = d ? sanitize(d) : clone(DEFAULT_LAYOUT);
    if (!L || JSON.stringify(L) === JSON.stringify(layout)) return;
    if (drag) { cancelDrag(); }
    layout = L; render();
  }
  function todayLt(){
    var d = new Date(), WD = ['sekmadienis','pirmadienis','antradienis','trečiadienis','ketvirtadienis','penktadienis','šeštadienis'];
    var MO = ['sausio','vasario','kovo','balandžio','gegužės','birželio','liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];
    var w = WD[d.getDay()]; return w.charAt(0).toUpperCase() + w.slice(1) + ', ' + MO[d.getMonth()] + ' ' + d.getDate() + ' d.';
  }
  function seedIfEmpty(){                     /* a brand-new list: first day = today */
    if (boardExists !== false || seeded || !editable) return;
    seeded = true;
    var o = {}; o['texts/d1.title'] = todayLt(); text['texts/d1.title'] = o['texts/d1.title'];
    fb.setDoc(boardRef, { layout: layoutData(), t: o, at: fb.serverTimestamp() }, { merge: true });
    render();
  }
  function listenBoard(){
    fb.onSnapshot(boardRef, { includeMetadataChanges: true }, function(snap){
      var d = snap.exists() ? snap.data() : null;
      if (!snap.metadata.fromCache) { boardExists = !!d; seedIfEmpty(); }
      onLayout(d && d.layout ? d.layout : null);
      var t = (d && d.t) || {}, k;
      for (k in t) if (typeof t[k] === 'string') apply(k, t[k]);
      for (k in seenKeys) if (!has(t, k)) apply(k, null);
      seenKeys = t;
      if (!editable) live(snap.metadata.fromCache);
    }, function(){ say('Nebeatsinaujina. Perkraukite puslapį.', 'err'); });
  }
  function listenPics(){
    fb.onSnapshot(fb.collection(boardRef, 'pics'), function(snap){
      snap.docChanges().forEach(function(ch){ onPic(ch.doc.id, ch.type === 'removed' ? null : ch.doc.data(), ch.type === 'removed'); });
    }, function(){});
  }

  /* ---------- modes ---------- */
  var lastLive = 0;
  function live(fromCache){
    if (!db || editable) return;
    if (fromCache === undefined) fromCache = !lastLive;
    if (fromCache) say(lastLive ? 'Nėra ryšio. Rodoma ' + lastLive + ' versija.' : 'Jungiamasi\u2026');
    else { lastLive = hhmm(); say('Gyvai. Atnaujinta ' + lastLive + '.', 'live'); }
  }
  function lock(msg){ locked = true; document.getElementById('stopEdit').hidden = true; if (editable) { editable = false; render(); } if (msg) say(msg, 'ro'); else live(); }
  function unlock(){ locked = false; editable = true; document.getElementById('stopEdit').hidden = false; render(); seedIfEmpty(); say('Viskas išsaugoma rašant. \u22ef mygtukai prideda arba ištrina eilutes, stulpelius ir dienas.'); }

  function clean(s){
    return String(s || '').replace(/\u2060/g, '').replace(/\u2011/g, '-').replace(/\r/g, '').replace(/[\uD800-\uDFFF]/g, '')
      .replace(PHONE, function(m){ return m.replace(/ /g, '\u00a0'); });
  }

  /* ---------- start ---------- */
  render();
  var rz = 0;
  window.addEventListener('resize', function(){ cancelAnimationFrame(rz); rz = requestAnimationFrame(fitAll); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  /* ---------- who may edit: hidden way in, then Google sign-in ---------- */
  function sha256hex(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
  function checkEditor(u){ if (!u || !u.email) return Promise.resolve(false); return sha256hex(String(u.email).trim().toLowerCase()).then(function(x){ return EDITOR_HASHES.indexOf(x) >= 0; }, function(){ return false; }); }
  var userIsEditor = false;
  var authReady = null;
  function startAuth(){
    if (authReady) return authReady;
    authReady = imp('firebase-auth.js').then(function(a){
      authMod = a; auth = a.getAuth(fbApp);
      return new Promise(function(res){
        var first = true;
        a.onAuthStateChanged(auth, function(u){
          user = u;
          checkEditor(u).then(function(ok){
            userIsEditor = ok;
            if (ok && getFlag()) { if (!editable) unlock(); }
            else if (editable) lock('');
            if (first) { first = false; res(); }
          });
        });
      });
    });
    return authReady;
  }
  var gate = document.getElementById('gate'), gateMsg = document.getElementById('gateMsg'), gateGo = document.getElementById('gateGo');
  function openGate(){
    if (!fbApp) return;
    startAuth().then(function(){
      if (userIsEditor) { if (editable) { setFlag(0); lock(''); } else { setFlag(1); unlock(); } return; }
      gateMsg.textContent = user ? 'Ši Google paskyra negali redaguoti.' : '';
      gateGo.disabled = false; gate.hidden = false; gateGo.focus();
    }, function(){ say('Nepavyko atidaryti prisijungimo.', 'err'); });
  }
  gateGo.addEventListener('click', function(){
    gateGo.disabled = true; gateMsg.textContent = '';
    authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()).then(function(r){
      return checkEditor(r.user).then(function(ok){
        userIsEditor = ok;
        if (ok) { setFlag(1); gate.hidden = true; if (!editable) unlock(); }
        else { gateMsg.textContent = 'Ši Google paskyra negali redaguoti.'; authMod.signOut(auth); gateGo.disabled = false; }
      });
    }, function(e){
      var c = e && e.code; gateGo.disabled = false;
      gateMsg.textContent = c === 'auth/popup-blocked' ? 'Naršyklė užblokavo langą. Leiskite iššokančius langus.' :
        c === 'auth/unauthorized-domain' ? 'Šis adresas dar neleistas Firebase nustatymuose.' :
        c === 'auth/operation-not-allowed' ? 'Google prisijungimas dar neįjungtas Firebase nustatymuose.' :
        (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') ? '' : 'Nepavyko prisijungti.';
    });
  });
  document.getElementById('gateClose').addEventListener('click', function(){ gate.hidden = true; });
  document.getElementById('stopEdit').addEventListener('click', function(){ setFlag(0); lock(''); });
  /* PC: type "sarek" anywhere outside a text box */
  var typed = '', typedAt = 0;
  document.addEventListener('keydown', function(ev){
    var t = ev.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey || !ev.key || ev.key.length !== 1) return;
    var now = Date.now(); if (now - typedAt > 2500) typed = ''; typedAt = now;
    typed = (typed + ev.key.toLowerCase()).slice(-5);
    if (typed === 'sarek') { typed = ''; openGate(); }
  });
  /* phone / iPad: hold the van logo for 10 seconds (a ring shows after 2) */
  var mark = document.getElementById('mark'), holdT = 0, showT = 0;
  function holdStop(){ clearTimeout(holdT); clearTimeout(showT); mark.classList.remove('holding'); }
  mark.addEventListener('pointerdown', function(ev){
    holdStop();
    showT = setTimeout(function(){ mark.classList.add('holding'); }, 2000);
    holdT = setTimeout(function(){ holdStop(); openGate(); }, 10000);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(n){ mark.addEventListener(n, holdStop); });
  mark.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });

  window.addEventListener('hashchange', function(){ location.reload(); });
  if (!FIREBASE.apiKey) { lock('Puslapis dar neprijungtas prie duomenų bazės.'); return; }
  if (!BOARD) { lock('Atidarykite visą nuorodą, kurią gavote.'); return; }
  say('Jungiamasi\u2026');
  Promise.all([imp('firebase-app.js'), imp('firebase-firestore.js')]).then(function(m){
    fb = Object.assign({}, m[0], m[1]);
    fbApp = fb.initializeApp(FIREBASE);
    var store;
    try { store = fb.initializeFirestore(fbApp, { localCache: fb.persistentLocalCache({ tabManager: fb.persistentMultipleTabManager() }) }); }
    catch (e) { store = fb.getFirestore(fbApp); }
    boardRef = fb.doc(store, 'boards', BOARD);
    db = FS;
    listenBoard(); listenPics();
    if (getFlag()) startAuth(); else lock('');
  }, function(){ lock('Nepavyko prisijungti. Patikrinkite internetą ir perkraukite puslapį.'); });
})();
